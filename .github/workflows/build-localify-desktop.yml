name: Build Localify Desktop

on:
  push:
    branches:
      - localify-desktop-electron
    paths:
      - "index.html"
      - "covers.json"
      - "covers/**"
      - "favicon.png"
      - "Localify Discord Player.exe"
      - "desktop_app/**"
      - ".github/workflows/build-localify-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - name: Checkout current Localify
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build installer and portable EXE
        run: npm run dist

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Localify-Desktop-Windows
          path: |
            desktop_app/release/*Setup*.exe
            desktop_app/release/*portable*.exe
          if-no-files-found: error
