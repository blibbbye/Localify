name: Build Localify Desktop Player

on:
  push:
    branches: [main]
    paths:
      - "desktop_player/**"
      - ".github/workflows/build-desktop-player.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build EXE
        shell: powershell
        run: |
          $vs = & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation
          New-Item -ItemType Directory -Force dist | Out-Null
          cl.exe /nologo /std:c++20 /O2 /EHsc /DUNICODE /D_UNICODE /DNOMINMAX desktop_player\LocalifyDesktopPlayer.cpp /link /SUBSYSTEM:WINDOWS /OUT:"dist\Localify Discord Player.exe" user32.lib gdi32.lib gdiplus.lib winhttp.lib ws2_32.lib dwmapi.lib

      - name: Publish EXE into repository
        shell: powershell
        run: |
          Copy-Item "dist\Localify Discord Player.exe" ".\Localify Discord Player.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Localify Discord Player.exe"
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Localify Desktop Player EXE"
            git push
          } else {
            Write-Host "EXE is already up to date."
          }
